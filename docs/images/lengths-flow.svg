<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6" fill="#333" />
    </marker>
  </defs>
  <rect x="20" y="40" width="160" height="60" rx="8" fill="#f5f7fb" stroke="#333"/>
  <text x="100" y="70" text-anchor="middle" font-family="Arial" font-size="14">Waveform</text>

  <rect x="220" y="40" width="180" height="60" rx="8" fill="#e8f4ff" stroke="#333"/>
  <text x="310" y="66" text-anchor="middle" font-family="Arial" font-size="14">FBank</text>
  <text x="310" y="86" text-anchor="middle" font-family="Arial" font-size="12">mean norm w/ lengths</text>

  <rect x="440" y="40" width="200" height="60" rx="8" fill="#f0ffe8" stroke="#333"/>
  <text x="540" y="66" text-anchor="middle" font-family="Arial" font-size="14">ERes2NetV2</text>
  <text x="540" y="86" text-anchor="middle" font-family="Arial" font-size="12">map lengths to T</text>

  <rect x="680" y="40" width="180" height="60" rx="8" fill="#fff5e8" stroke="#333"/>
  <text x="770" y="66" text-anchor="middle" font-family="Arial" font-size="14">Masked Pooling</text>
  <text x="770" y="86" text-anchor="middle" font-family="Arial" font-size="12">TSTP / MaskedTSTP</text>

  <rect x="680" y="130" width="180" height="60" rx="8" fill="#f5f7fb" stroke="#333"/>
  <text x="770" y="162" text-anchor="middle" font-family="Arial" font-size="14">Embedding</text>

  <line x1="180" y1="70" x2="220" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="70" x2="440" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="70" x2="680" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="100" x2="770" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="150" font-family="Arial" font-size="12" fill="#444">lengths</text>
  <line x1="80" y1="146" x2="220" y2="120" stroke="#444" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="260" y1="118" x2="440" y2="118" stroke="#444" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="480" y1="118" x2="680" y2="118" stroke="#444" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
